<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シフトメニュー</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="index.js"></script>
  </head>
  <body>
    <div class="menu-container">
      <h2>まいぺーじ</h2>

      <!-- Lark情報表示エリア -->
      <div id="lark-data-container" style="margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 8px; background-color: #f9f9f9;">
        <h3 style="margin-top: 0; font-size: 16px;">Neo Quick Call ログイン情報</h3>
        <div id="lark-data-content" style="font-size: 14px; color: #666;">データを読み込んでいます...</div>
      </div>

      <button id="btn-rules" class="menu-btn notion-btn">
        📖 勤怠ルールを確認
      </button>
      
      <button id="btn-check" class="menu-btn liff-btn">
        📅 シフト確認 / 変更
      </button>
      
      <button id="btn-submit" class="menu-btn liff-btn">
        📝 シフト一括提出
      </button>
    </div>
  </body>
</html>
